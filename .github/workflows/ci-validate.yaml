name: CI Validate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "poly.toml"
      - ".task/**"
      - ".ai-rulez/**"
      - "alef.toml"
      - "spikard-http.toml"
      - "Taskfile.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "biome.json"
  pull_request:
    branches: [main]
    paths:
      - ".github/**"
      - "poly.toml"
      - ".task/**"
      - ".ai-rulez/**"
      - "alef.toml"
      - "spikard-http.toml"
      - "Taskfile.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "biome.json"

concurrency:
  group: ci-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: short
  BUILD_PROFILE: ci
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  validate:
    name: Validate generated files and workflow syntax
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: xberg-io/actions/setup-python-env@v1
        with:
          python-version: "3.14"

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          toolchain: "1.95"
          cache-key-prefix: validate
          use-sccache: "true"

      - name: Setup Node
        uses: xberg-io/actions/setup-node-workspace@v1
        with:
          node-version: "24"

      - name: Install Alef
        uses: xberg-io/actions/install-alef@v1

      - name: Install Task
        uses: xberg-io/actions/install-task@v1

      - name: Check Taskfile surface
        run: task --list

      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-check
          fail_level: error

      - name: Setup JDK 25 for checkstyle
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      # ~keep poly's whole-project phase (which `task lint:check` -> `poly lint .` always
      # runs unless `--no-workspace` is passed) auto-discovers golangci-lint, rubocop, credo,
      # and dart-analyze project checks from packages/go, packages/ruby, packages/elixir, and
      # packages/dart. Without these toolchains on PATH each hook fails with
      # `poly-hook: 1: <tool>: not found` (exit 201) instead of actually linting. Mirrors the
      # sibling repos' `reusable-validate.yml` inputs (see liter-llm's ci-lint.yaml).
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: packages/go/go.mod

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: packages/ruby

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Resolve Dart deps
        working-directory: packages/dart
        run: dart pub get

      - name: Setup Elixir
        uses: xberg-io/actions/setup-elixir@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      # ~keep best-effort like reusable-validate.yml's equivalent step: `mix format` (which
      # poly's Elixir hook delegates to) reads `.formatter.exs`'s `import_deps`, which needs
      # deps on disk, but a failed `mix deps.get` here should not fail the whole lint job.
      - name: Resolve Elixir deps (best-effort)
        working-directory: packages/elixir
        continue-on-error: true
        run: mix deps.get || echo "mix deps.get skipped — non-fatal for poly"

      # ~keep poly delegates formatting to native tools when present, and their output decides
      # whether alef:verify's byte-level freshness check passes: generated Java (and C/C#) go
      # through clang-format and shell through shfmt. The runner image ships a different
      # clang-format, which rewrites generated Java so the re-render no longer matches the
      # committed bytes. Install the pinned clang-format + shfmt (same as reusable-validate.yml)
      # before poly and alef:verify.
      - name: Set up clang-format and shfmt
        uses: xberg-io/actions/setup-c-cpp-tools@v1
        with:
          install-cppcheck: "false"
          install-shellcheck: "false"

      - name: Install poly
        uses: Goldziher/polylint@v0

      # ~keep alef:verify re-runs the generated-file formatters to reproduce the committed
      # bytes, so it must run with poly AND the language toolchains (JDK, clang-format, shfmt,
      # ...) already on PATH. Run it here, after every setup step, rather than early --
      # otherwise the re-render formats generated .java/.md/.sh differently and the freshness
      # check reports spurious drift.
      - name: Verify Alef output
        run: task alef:verify

      - name: Lint (poly)
        run: task lint:check
