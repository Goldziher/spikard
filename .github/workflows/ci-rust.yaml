name: CI Rust

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "tools/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/config.toml"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/ci-rust.yaml"
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "tools/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/config.toml"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/ci-rust.yaml"

concurrency:
  group: ci-rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: short
  BUILD_PROFILE: ci
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  MATURIN_PEP517_ARGS: "--locked"

permissions:
  contents: read

jobs:
  # NOTE: clippy and test each cold-compile the full core workspace
  # (async-graphql, tonic, tower-http, utoipa, …) with --all-features. Running
  # them sequentially in one job exceeded the 90-minute cap on a cold sccache,
  # and a cancelled job never saves its cache — so every run restarted cold.
  # Splitting into parallel per-suite jobs halves each job's work so it finishes
  # and populates the cache; only the `test` suite needs the language toolchains.
  rust:
    name: Rust ${{ matrix.suite }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # ~keep 90 minutes killed the `test` suite on both platforms, every run, for days --
    # and a killed job reads as `cancelled`, which looks self-inflicted rather than like a
    # limit being hit. Measured on 34393823986: compilation finished in 13 minutes and the
    # rest was test runtime, dominated by spikard-cli's 531 tests at 1420s and still going
    # in graphql_codegen_integration when the axe fell. Nothing failed and nothing hung.
    # This interacts with the cache note above: a killed job never saves its cache, so every
    # run restarted cold and re-earned the timeout. The limit has to exceed the real runtime
    # once for that cycle to break.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
        suite: [lint, test]
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: xberg-io/actions/free-disk-space-linux@v1
        with:
          show-initial: "false"
          show-final: "true"

      # ~keep Only the test suite needs a mise-managed language here (Ruby); the lint suite runs
      # ~keep cargo alone, so it sets mise up without installing any tool.
      - name: Setup mise
        uses: xberg-io/actions/setup-mise@v1
        with:
          install: ${{ matrix.suite == 'test' && 'true' || 'false' }}
          tools: ruby

      - name: Setup Python
        uses: xberg-io/actions/setup-python-env@v1
        with:
          python-version: "3.14"

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          toolchain: "1.99.1"
          cache-key-prefix: rust-${{ matrix.os }}-${{ matrix.suite }}
          use-sccache: "true"

      # NOTE: Language toolchains are only needed by the test suite (some
      # core-crate tests exercise binding-adjacent codegen); clippy/fmt/check
      # are pure Rust and skip them for a faster lint job.
      - name: Setup Node workspace
        if: matrix.suite == 'test'
        uses: xberg-io/actions/setup-node-workspace@v1

      - name: Setup PHP
        if: matrix.suite == 'test'
        uses: xberg-io/actions/setup-php@v1
        with:
          php-version: "8.4"
          tools: phpstan

      - name: Setup Elixir
        if: matrix.suite == 'test'
        uses: xberg-io/actions/setup-elixir@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - name: Install Ruby binding dependencies
        if: matrix.suite == 'test'
        working-directory: packages/ruby
        run: bundle install

      # The codegen quality-gate tests (spikard-cli) shell out to `poly lint` to
      # validate generated Python instead of requiring a standalone `ruff`/`uv`
      # install in CI. Only needed by the test suite, which runs those tests.
      # ~keep mise.toml pins poly, so alef verify and lint format with the same release locally.
      - name: Install poly
        if: matrix.suite == 'test'
        uses: xberg-io/actions/setup-mise@v1
        with:
          tools: github:Goldziher/poly

      - name: Run clippy and format check
        if: matrix.suite == 'lint'
        run: mise run rust:lint:check

      - name: Check no-default-features
        if: matrix.suite == 'lint'
        run: cargo check -p spikard --no-default-features

      - name: Run Rust tests
        if: matrix.suite == 'test'
        run: mise run rust:test:ci

  # ~keep The workspace declares rust-version 1.95 and the published-package test builds spikard
  # ~keep on 1.95, so a newer-Rust construct must fail here, before release.
  msrv:
    name: Rust MSRV check (1.95)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Setup mise
        uses: xberg-io/actions/setup-mise@v1
        with:
          install: "false"

      - name: Setup Rust 1.95
        uses: xberg-io/actions/setup-rust@v1
        with:
          toolchain: "1.95"
          cache-key-prefix: rust-msrv
          use-sccache: "true"

      - name: Check the published crates on 1.95
        run: mise run rust:check:msrv
