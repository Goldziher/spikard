name: CI E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "alef.toml"
      - "spikard-http.toml"
      - "fixtures/**"
      - "crates/**"
      - "packages/**"
      - "e2e/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Taskfile.yaml"
      - ".task/**"
      - ".github/workflows/ci-e2e.yaml"
  pull_request:
    branches: [main]
    paths:
      - "alef.toml"
      - "spikard-http.toml"
      - "fixtures/**"
      - "crates/**"
      - "packages/**"
      - "e2e/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Taskfile.yaml"
      - ".task/**"
      - ".github/workflows/ci-e2e.yaml"

concurrency:
  group: ci-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: short
  BUILD_PROFILE: ci
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  MATURIN_PEP517_ARGS: "--locked"

permissions:
  contents: read

jobs:
  e2e:
    name: ${{ matrix.language }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout-minutes || 60 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            os: ubuntu-latest
          - language: python
            os: ubuntu-latest
          - language: node
            os: ubuntu-latest
          - language: ruby
            os: ubuntu-latest
          - language: php
            os: ubuntu-latest
          - language: elixir
            os: ubuntu-latest
            timeout-minutes: 90
          - language: go
            os: ubuntu-latest
          - language: java
            os: ubuntu-latest
          - language: csharp
            os: ubuntu-latest
          - language: kotlin
            os: ubuntu-latest
          - language: dart
            os: ubuntu-latest
          - language: swift
            os: macos-latest
          - language: zig
            os: ubuntu-latest
          - language: wasm
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          toolchain: "1.95"
          cache-key-prefix: e2e-${{ matrix.language }}-${{ matrix.os }}
          use-sccache: "true"

      - name: Setup Python
        if: matrix.language == 'python'
        uses: xberg-io/actions/setup-python-env@v1
        with:
          python-version: "3.14"

      - name: Setup Node
        if: matrix.language == 'node' || matrix.language == 'wasm'
        uses: xberg-io/actions/setup-node-workspace@v1
        with:
          node-version: "24"

      - name: Setup Ruby
        if: matrix.language == 'ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: e2e/ruby

      - name: Setup PHP
        if: matrix.language == 'php'
        uses: xberg-io/actions/setup-php@v1
        with:
          php-version: "8.4"

      - name: Build PHP native extension
        # ~keep run_tests.php refuses to run without a built extension, and the app harness
        # ~keep constructs Spikard\Php\App, which the extension registers -- there is no PHP
        # ~keep source for it (packages/php/src holds no .php files). Two things make the
        # ~keep build command unlike every other binding crate, and both are load-bearing:
        # ~keep the crate is excluded from the root workspace, so `-p spikard-php` from the
        # ~keep repo root does not match any package and it builds into its own target/;
        # ~keep and the whole crate body is gated behind `extension-module`, which is
        # ~keep deliberately not in `default`. Built without that feature it still links --
        # ~keep it just produces an empty dylib with no symbols, which fails later and much
        # ~keep less clearly. run_tests.php probes crates/spikard-php/target/release, which
        # ~keep is exactly where this puts it.
        if: matrix.language == 'php'
        working-directory: crates/spikard-php
        shell: bash
        run: cargo build --release --features extension-module

      - name: Install PHP binding package dependencies
        # ~keep e2e/php/bootstrap.php requires TWO autoloaders: its own (PHPUnit, test
        # ~keep helpers) and the binding package's, which is what exposes Spikard\Php\*
        # ~keep via the PSR-4 map in packages/php/composer.json. vendor/ is gitignored and
        # ~keep nothing here created the second one, so the suite aborted with
        # ~keep "PHP binding package autoloader not found at packages/php/vendor/autoload.php"
        # ~keep before running a test.
        if: matrix.language == 'php'
        working-directory: packages/php
        shell: bash
        run: composer install --no-interaction --no-progress

      - name: Setup Elixir
        if: matrix.language == 'elixir'
        uses: xberg-io/actions/setup-elixir@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v6
        with:
          go-version-file: packages/go/go.mod

      - name: Setup JDK 25 for Maven
        if: matrix.language == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Maven
        if: matrix.language == 'java'
        uses: xberg-io/actions/setup-maven@v1

      - name: Setup Gradle
        if: matrix.language == 'kotlin'
        uses: xberg-io/actions/setup-gradle@v1
        with:
          java-version: "25"
          gradle-version: "9.5.1"

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Setup Dart
        if: matrix.language == 'dart'
        uses: dart-lang/setup-dart@v1

      - name: Setup Swift
        if: matrix.language == 'swift'
        uses: xberg-io/actions/setup-swift@v1

      - name: Build Swift package
        if: matrix.language == 'swift'
        uses: xberg-io/actions/build-swift-package@v1
        with:
          package-dir: packages/swift
          crate-name: spikard-swift

      # The generated Swift E2E harness links target/debug/libspikard_ffi.a
      # (staticlib), which build-swift-package does not produce; build it here.
      - name: Build spikard-ffi static library (Swift E2E)
        if: matrix.language == 'swift'
        run: cargo build -p spikard-ffi

      - name: Setup Zig
        if: matrix.language == 'zig'
        uses: xberg-io/actions/setup-zig@v1

      - name: Setup wasm-pack
        if: matrix.language == 'wasm'
        uses: xberg-io/actions/setup-wasm-pack@v1

      - name: Install Alef
        uses: xberg-io/actions/install-alef@v1

      - name: Install Task
        uses: xberg-io/actions/install-task@v1

      - name: Build and bundle Go native library
        if: matrix.language == 'go'
        run: |
          cargo build --locked -p spikard-ffi --release
          mkdir -p packages/go/.lib/linux-x86_64
          cp target/release/libspikard_ffi.so packages/go/.lib/linux-x86_64/libspikard_ffi.so

      - name: Build Go harness
        if: matrix.language == 'go'
        run: cd e2e/go && go build -o cmd/harness/harness ./cmd/harness/

      - name: Build and bundle Java native library
        if: matrix.language == 'java'
        run: |
          cargo build --locked -p spikard-ffi --release
          mkdir -p packages/java/src/main/resources/natives/linux-x86_64
          cp target/release/libspikard_ffi.so packages/java/src/main/resources/natives/linux-x86_64/libspikard_ffi.so

      - name: Generate E2E suites
        run: task e2e:generate

      - name: Run generated E2E suites
        run: task ${{ matrix.language }}:e2e
