version: "3"
internal: true

includes:
  platforms: ../config/platforms.yml

vars:
  ALEF: "cargo run -p spikard-alef --release --"

tasks:
  sync:
    desc: "Synchronize version across all package manifests and regenerate everything"
    cmds:
      - "{{.ALEF}} sync-versions"
      # `alef all --clean` regenerates every Alef-managed output (readme, docs,
      # bindings, scaffold, stubs, e2e, test-apps) in the correct internal order.
      # Do NOT re-expand this into individual sub-commands: hand-ordering `docs`
      # before `generate --clean` lets the clean wipe docs/reference/ after it is
      # written. `all` runs them in dependency order.
      - "{{.ALEF}} all --clean"
      # cbindgen header (crates/spikard-ffi/include/spikard.h) is emitted by
      # spikard-ffi's build.rs, not by `alef all`; build it so the header stays fresh.
      - "cargo build -p spikard-ffi"
      # ~keep dart FRB codegen + fix_handler_executor_calls() only run during cargo build,
      # not during `alef all` (which emits Rust source only).
      - cmd: |
          if command -v cargo >/dev/null 2>&1; then
            cargo build --manifest-path packages/dart/rust/Cargo.toml 2>&1 | grep -v "^warning:" || true
          fi
        ignore_error: true
      - cmd: |
          set -e
          version=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          for manifest in packages/dart/rust packages/ruby/ext/spikard_rb/native test_apps/rust; do
            cargo update --manifest-path "$manifest/Cargo.toml" -p spikard --precise "$version" >/dev/null 2>&1 || true
          done

  check:
    desc: "Check if versions are synchronized (dry-run)"
    cmds:
      # Print the workspace version, then actually verify every language manifest
      # matches it. The previous version of this task only printed and never compared,
      # so it reported success regardless of drift.
      - cmd: grep -m 1 'version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/'
        silent: false
      - "{{.ALEF}} validate versions"

  bump:major:
    desc: "Bump major version (X.0.0) and sync"
    cmds:
      - "{{.ALEF}} sync-versions --bump major"
      - task: sync

  bump:minor:
    desc: "Bump minor version (0.X.0) and sync"
    cmds:
      - "{{.ALEF}} sync-versions --bump minor"
      - task: sync

  bump:patch:
    desc: "Bump patch version (0.0.X) and sync"
    cmds:
      - "{{.ALEF}} sync-versions --bump patch"
      - task: sync

  set:
    desc: "Set explicit version and sync (usage: task version:set -- 0.7.0-rc.1)"
    requires:
      vars: [CLI_ARGS]
    cmds:
      - "{{.ALEF}} sync-versions --set {{.CLI_ARGS}}"
      - task: sync

  show:
    desc: "Show current version from Cargo.toml"
    cmds:
      - cmd: grep -m 1 'version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/'
        silent: false
