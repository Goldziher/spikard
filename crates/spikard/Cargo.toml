[package]
name = "spikard"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true
homepage.workspace = true
description = "High-performance HTTP framework built on Axum and Tower-HTTP with type-safe routing, validation, WebSocket/SSE support, and lifecycle hooks"
keywords = ["http", "framework", "axum", "tower", "api"]
categories = ["web-programming::http-server", "web-programming::http-client"]
documentation = "https://docs.rs/spikard"
readme = "README.md"
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/LICENSE*", "/README*"]

[package.metadata.cargo-machete]
ignored = ["anyhow"]

[lib]
name = "spikard"
path = "src/lib.rs"

[features]
default = ["di"]
di = ["spikard-http/di", "spikard-core/di"]
# Enabled in the downloadable `openapi` component's producer crate so the component
# compiles the reference `OpenApiCompiler` into its cdylib. See `src/components.rs`. ~keep
codegen-openapi = ["dep:spikard-codegen"]

[dependencies]
alef-component-abi = "0.107.11"
anyhow = "1.0"
async-graphql = "7"
axum.workspace = true
axum-test = "21"
base64 = "0.23"
bytes = "1.12"
schemars = { version = "1.2", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
spikard-codegen = { workspace = true, optional = true }
spikard-core = { workspace = true, optional = true }
spikard-graphql = { workspace = true }
spikard-http = { workspace = true }
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
