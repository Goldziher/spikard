[package]
name = "spikard-rb"
version = "0.17.0-rc.10"
edition = "2024"
license = "MIT"
description = "Codegen-first polyglot web toolkit with a Rust core and bindings for 14 languages"
readme = false
keywords = ["framework", "http", "polyglot", "rust", "web"]
categories = []

[package.metadata.cargo-machete]
ignored = ["rb-sys"]

[lib]
name = "spikard_rb"
path = "../src/lib.rs"
crate-type = ["cdylib"]

[features]
default = ["di"]
di = ["spikard/di"]

[dependencies]
magnus = "0.8"
rb-sys = ">=0.9, <0.9.128"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spikard = { version = "0.17.0-rc.10", path = "../../../../../crates/spikard", features = ["di"] }
spikard-core = { path = "../../../../../crates/spikard-core", version = "0.17.0-rc.10" }
spikard-graphql = { path = "../../../../../crates/spikard-graphql", version = "0.17.0-rc.10" }
spikard-http = { path = "../../../../../crates/spikard-http", version = "0.17.0-rc.10" }
tokio = { version = "1", features = ["rt-multi-thread"] }
