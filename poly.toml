extends = [
  { id = "alef-poly-base", git = "https://github.com/xberg-io/alef.git", revision = "main", file = "poly-base.toml" },
]

[discovery]
exclude = [
  "**/*.freezed.dart",
  "**/*.g.dart",
  "**/*.jinja",
  "**/*.lock",
  "**/Cargo.lock",
  "**/go.sum",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/uv.lock",
  ".alef/**",
  "artifacts/**",
  "dist/**",
  "docs/assets/**",
  "docs/snippets/**",
  "fixtures/**",
  "node_modules/**",
  "readme_templates/**",
  "target/**",
  "templates/readme/**",
  "test_documents/**",
  "vendor/**",
  "**/Cargo.toml",
  "crates/spikard-ffi/include/spikard.h",
  "crates/spikard-node/service_http_additions.ts",
  "packages/go/include/spikard.h",
  "**/_generated/**",
  "**/coverage/**",
  "**/pkg/**",
  "**/.next/**",
  "**/*.min.js",
  "**/vendored/**",
  "**/*.diff",
  "**/*.patch",
  "**/frb_generated.rs",
]

[lint.markdown.rumdl]
disable = ["MD012", "MD013", "MD024", "MD033", "MD036", "MD041", "MD046", "MD051", "MD076"]

[fmt.markdown.rumdl]
disable = ["MD012", "MD013", "MD024", "MD033", "MD036", "MD041", "MD046", "MD051", "MD076"]

[lint.typos.extend_words]
Caf = "Caf"
Enumerables = "Enumerables"
FO = "FO"
Fo = "Fo"
Hte = "Hte"
Iz = "Iz"
Jod = "Jod"
ND = "ND"
Parm = "Parm"
Tre = "Tre"
Ue = "Ue"
Userr = "Userr"
bre = "bre"
caf = "caf"
enumerables = "enumerables"
fo = "fo"
fre = "fre"
hte = "hte"
lsit = "lsit"
nam = "nam"
ser = "ser"
tre = "tre"
ure = "ure"
wre = "wre"

[lint.uncomment]
enabled = true
remove_todos = false
remove_fixme = false
remove_docs = false
use_default_ignores = true
preserve_patterns = ["SAFETY", "SPDX", "Copyright", "License", "licensed under", "HACK", "WORKAROUND", "NOTE"]

